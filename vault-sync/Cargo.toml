[package]
name = "vault-sync"
version = "0.1.0"
edition = "2021"
publish = false
description = "Item sync port for CitriPass"

[dependencies]
base64 = "0.22"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
uuid = { version = "1", features = ["v4"] }
vault-core = { path = "../vault-core" }
vault-storage = { path = "../vault-storage" }

[dev-dependencies]
vault-storage-sqlite = { path = "../vault-storage-sqlite" }
